# Genera las tarjetas de estadísticas como SVG dentro de este mismo repo
name: Actualizar tarjetas del README

on:
  schedule:
    - cron: "0 0 * * *" # todos los días a medianoche (UTC)
  workflow_dispatch: # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Tarjeta de estadísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&locale=es
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tarjeta de lenguajes
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&locale=es
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar tarjetas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Actualizar tarjetas del README" || exit 0
          git push
